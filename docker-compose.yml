services:
  jobs-init:
    image: alpine:3.21
    command: ["chown", "10001:10001", "/jobs"]
    volumes: [./runtime/jobs:/jobs]
  web:
    build: ./web
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL:?Set a PocketBase superuser email}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD:?Set a PocketBase superuser password}
      REDIS_URL: redis://redis:6379/0
      JOBS_DIR: /jobs
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
      GOOGLE_ONLY: ${GOOGLE_ONLY:-false}
    volumes: [./runtime/jobs:/jobs]
    ports: ["127.0.0.1:${WEB_PORT:-8007}:3000"]
    networks: [default, backend]
    depends_on:
      jobs-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      pocketbase: { condition: service_healthy }
  worker:
    build: ./worker
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL:?Set a PocketBase superuser email}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD:?Set a PocketBase superuser password}
      REDIS_URL: redis://redis:6379/0
      JOBS_DIR: /jobs
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
    volumes: [./runtime/jobs:/jobs]
    networks: [backend]
    depends_on:
      jobs-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      pocketbase: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1536M }
  redis:
    image: redis:7-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  pocketbase:
    build: ./pocketbase
    environment:
      POCKETBASE_SUPERUSER_EMAIL: ${POCKETBASE_SUPERUSER_EMAIL:?Set a PocketBase superuser email}
      POCKETBASE_SUPERUSER_PASSWORD: ${POCKETBASE_SUPERUSER_PASSWORD:?Set a PocketBase superuser password}
    ports: ["127.0.0.1:${POCKETBASE_PORT:-8009}:8090"]
    networks: [default, backend]
    volumes:
      - pocketbase_data:/pb_data
      - ./pocketbase/pb_migrations:/pb_migrations:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pocketbase_data:
# The backend network is internal (no host or internet route), so worker and
# redis stay isolated; web and pocketbase join it for redis/PocketBase access
# while their published host ports ride the default network, because Docker
# Desktop does not forward ports for containers that only have internal IPs.
networks:
  default: {}
  backend:
    internal: true
