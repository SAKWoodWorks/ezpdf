# Production overlay: run `docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d`
# Keeps the localhost-only port bindings from the base file (safe on a server:
# admin stays reachable only through an SSH tunnel) and adds Caddy for public
# HTTPS on 80/443, proxying to the web app. Requires DOMAIN in .env.
services:
  web:
    restart: unless-stopped
  worker:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  pocketbase:
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_started }
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. ezpdf.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
